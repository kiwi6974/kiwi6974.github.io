:root{
  --bg:#F3F4F7;--frame:#FAFAFC;--card:#FFFFFF;--surface:#EEF0F4;--ink:#272733;--ink2:#565665;--sub:#9294A0;--line:#E4E6EC;--line2:#F0F1F5;
  --kiwi:#91BD3B;--kiwi-d:#4A9A62;--kiwi-l:#EDF5DF;
  --sea:#CFE3F3;--sea-txt:#4E79A6;--border:#FFFFFF;--muni:#7A8699;--nk:#C9D1DC;--nk-txt:#5F6B7A;--pin:#E0453F;--pin-txt:#FFFFFF;
  --m:#4A8FD4;--f:#E58FB0;--x:#A6A8B3;
  /* 시도별 색 — 행정도 포스터 톤 */
  --c-서울:#FBFBF4;--c-경기:#F7C9A2;--c-인천:#F6F6EE;--c-강원:#D7DFA2;--c-충북:#F3BBCB;--c-충남:#95C5E7;--c-대전:#F7F7F0;--c-세종:#F0F0E6;
  --c-전북:#EAD8B6;--c-전남:#B9DDA9;--c-광주광역시:#F7F7F0;--c-경북:#DCC9E6;--c-경남:#B9BEE8;--c-대구:#F7F7F0;--c-부산:#F7F7F0;--c-울산:#F7F7F0;--c-제주:#BFDCEC;
  --disp:'Gowun Dodum',sans-serif;--body:'IBM Plex Sans KR',Pretendard,-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
  --r:16px;--shadow:0 1px 2px rgba(24,24,34,.04),0 8px 26px rgba(24,24,34,.07)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171C;--frame:#1B1E24;--card:#22252C;--surface:#2A2E36;--ink:#ECEDF1;--ink2:#C3C5CE;--sub:#80838E;--line:#333740;--line2:#2B2F37;
  --kiwi:#9BC94A;--kiwi-d:#86B944;--kiwi-l:#2A3522;--sea:#17222E;--sea-txt:#6F94BF;--border:#0F141B;--muni:#9AA6B8;--nk:#2A3038;--nk-txt:#7C8796;--x:#5E616B;
  --c-서울:#3A3D40;--c-경기:#7E5A3E;--c-인천:#383B3F;--c-강원:#5E6A3C;--c-충북:#76484F;--c-충남:#355878;--c-대전:#3A3D40;--c-세종:#3A3D40;
  --c-전북:#6E5F43;--c-전남:#436543;--c-광주광역시:#3A3D40;--c-경북:#5E4C70;--c-경남:#464C76;--c-대구:#3A3D40;--c-부산:#3A3D40;--c-울산:#3A3D40;--c-제주:#3D566B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171C;--frame:#1B1E24;--card:#22252C;--surface:#2A2E36;--ink:#ECEDF1;--ink2:#C3C5CE;--sub:#80838E;--line:#333740;--line2:#2B2F37;
  --kiwi:#9BC94A;--kiwi-d:#86B944;--kiwi-l:#2A3522;--sea:#17222E;--sea-txt:#6F94BF;--border:#0F141B;--muni:#9AA6B8;--nk:#2A3038;--nk-txt:#7C8796;--x:#5E616B;
  --c-서울:#3A3D40;--c-경기:#7E5A3E;--c-인천:#383B3F;--c-강원:#5E6A3C;--c-충북:#76484F;--c-충남:#355878;--c-대전:#3A3D40;--c-세종:#3A3D40;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-inline:16px;padding-block:20px 40px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--kiwi-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;background:var(--frame);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.head{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 4px 4px}
.brand{font-family:var(--disp);font-size:20px;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--kiwi-d);letter-spacing:.08em}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);padding:4px;border-radius:12px}
.tabs button{padding:6px 12px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:12.5px}
.tabs button.on{background:var(--card);color:var(--kiwi-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mock{font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:2px 9px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ch h2{margin:0;font-size:14.5px;font-weight:700}
.ch .n{margin-left:auto;color:var(--sub);font-size:11.5px}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px}
.crumb button{padding:3px 8px;border-radius:8px;color:var(--ink2);font-weight:600}
.crumb button:hover{background:var(--surface)}
.crumb button.cur{background:var(--kiwi-l);color:var(--kiwi-d)}
.crumb .sep{color:var(--sub)}
/* 지도 */
.mapwrap{position:relative;background:var(--sea);aspect-ratio:400/500;max-height:720px;width:100%;touch-action:none;overflow:hidden}
.mapwrap svg{cursor:grab}.mapwrap.drag svg{cursor:grabbing}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.reg{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:opacity .25s}
.reg:hover{filter:brightness(.94)}
.reg.dim{opacity:.38}
.reg.dim:hover{opacity:.6}
.reg.leafsel{stroke:var(--ink);stroke-width:1.6}
.muni{fill:transparent;stroke:var(--muni);stroke-opacity:.5;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.muni:hover{fill:rgba(0,0,0,.07)}
.muni.on{fill:var(--kiwi-d);fill-opacity:.32;stroke:var(--kiwi-d);stroke-opacity:1;stroke-width:1.4}
.nk{fill:var(--nk);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.nkh{fill:url(#hatch);pointer-events:none}
.other{fill:var(--nk);fill-opacity:.55;stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl{font-family:var(--body);font-weight:700;fill:var(--ink);pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--border);stroke-opacity:.9;stroke-linejoin:round}
.lbl .cnt{font-weight:600;fill:var(--ink2)}
.sea-l{font-family:var(--disp);fill:var(--sea-txt);text-anchor:middle;pointer-events:none;opacity:.9}
.sea-l .en{font-family:var(--body);font-style:italic;font-weight:500;opacity:.8}
.nk-l{font-family:var(--body);fill:var(--nk-txt);text-anchor:middle;pointer-events:none;font-weight:600;letter-spacing:.06em}
.isl{fill:var(--c-경북);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.isl-l{font-family:var(--body);fill:var(--ink2);font-weight:600;pointer-events:none;text-anchor:middle}
.pin{cursor:pointer}
.pin circle{fill:var(--pin);stroke:var(--border);stroke-width:1.2;vector-effect:non-scaling-stroke}
.pin.on circle{fill:var(--kiwi-d)}
.pin text{font-family:var(--body);font-weight:700;fill:var(--pin-txt);text-anchor:middle;pointer-events:none}
.pin .nm{fill:var(--ink);text-anchor:start;font-weight:600;paint-order:stroke;stroke:var(--border);stroke-opacity:.9;stroke-linejoin:round}
.back{position:absolute;left:10px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:16px;font-weight:700;color:var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.legend{position:absolute;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;max-width:46%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--sub);padding:9px 14px;border-top:1px solid var(--line2)}
/* 명단 */
.list{display:flex;flex-direction:column;max-height:760px}
.list .body{overflow:auto;padding:8px 12px 14px;min-height:0}
.stat{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.chip.on{background:#FFF1DB;color:#B9741A;border-color:#E8C98F}
.chip b{font-weight:800}
.stat .k{flex:1 1 90px;background:var(--surface);border-radius:11px;padding:8px 11px;min-width:0}
.stat .k b{display:block;font-size:19px;font-family:var(--disp);line-height:1.1}
.stat .k span{font-size:11px;color:var(--sub)}
.filt{margin:10px 2px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--kiwi-l);border-radius:9px;padding:6px 10px}
.filt button{margin-left:auto;color:var(--kiwi-d);font-weight:600}
.grp{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.04em;margin:12px 2px 4px}
.grp button{color:var(--kiwi-d);font-weight:600;letter-spacing:0;margin-left:auto;font-size:11.5px}
.li{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;width:100%;text-align:left}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.center h1{font-family:var(--disp);font-weight:400;font-size:24px;margin:0}
.center input{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;text-align:center;font-size:16px}
.center .btn{font-size:13px;font-weight:700;padding:9px 15px;border-radius:11px;background:var(--kiwi);color:#fff;width:100%;max-width:340px}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(0,0,0,.12);border-top-color:var(--kiwi-d);animation:sp .7s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.hintp{font-size:12px;color:var(--sub);margin:0}
.li+.li{border-top:1px solid var(--line2)}
.av{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--m)}
.av.f{background:var(--f)}.av.x{background:var(--x)}
.tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx b{font-size:13.5px;font-weight:600}
.tx span{color:var(--sub);font-size:12px;margin-left:7px}
.pill{flex:none;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--sub)}
.pill.g{background:var(--kiwi-l);color:var(--kiwi-d)}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 14px;border-radius:11px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:12px;border-radius:18px}
  .list{max-height:none}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1;text-align:center}
  .view-map .list,.view-list .mapcard{display:none}
  .legend{max-width:60%}
}
@media (min-width:821px){.tabs{display:none}}
@media (prefers-reduced-motion:reduce){.reg{transition:none}}
</style>

  (function tick(){ n++; var c=document.getElementById("c"); if(c) c.textContent="("+(n*4)+"초)"; if(n>150){ fail(); return; } if(ready){ checkIndex(); return; }
    readMeta(function(m){ if(m&&(m.pub||0)>=v){ ready=true; checkIndex(); } else setTimeout(tick,4000); }); })(); }
var mv=/[?&]v=(\d+)/.exec(location.search), want=mv?+mv[1]:0, nowS=Date.now()/1000;
if(want>PUB) waitScreen(want);
else if(nowS>EXP){ screen('<h1>만료된 페이지입니다</h1><p class="hintp">방에서 .지역보기 를 다시 입력해 새 링크를 받아주세요.</p>'); readMeta(function(m){ if(m&&m.pub>PUB&&m.exp>nowS) waitScreen(m.pub); }); }
else if(PLAIN) start(utf8dec(PAYLOAD));
else if(!window.crypto||!crypto.subtle) screen('<h1>이 브라우저에서는 열 수 없습니다</h1><p class="hintp">Chrome · Safari 로 열어주세요</p>');
else unlockScreen("");
})();
