<!doctype html>
<!--KIWI-QJMAP:15-->
<!-- 15판 : 토스트를 상단 띠 + 화면 가운데 카드 두 곳에 똑같이 (공질 웹 8판과 동일) -->
<!-- 14판 : data.json 의 tpl 이 이 껍데기보다 새 판이면 토스트 안내 후 새 판이 배포되는 대로 자동 새로고침 -->
<!-- 13판 : 껍데기 + 자료 분리 — 이 HTML 은 방마다 한 번만 배포되고(치환 자리는 반복 횟수 하나), 자료는 data.json 으로 따로 올린다.
             새 링크(?v=)로 들어오면 기존 자료를 먼저 보여주고 토스트로 "새 자료 올리는 중" 을 띄운 뒤, 올라오면 새로고침 없이 그 자리에서 바꾼다.
             글꼴을 공질 웹(qjweb.html)과 같게 (BMJUA · Pretendard/시스템). data.json = {pub, exp, room, plain, b64 | s,i,c} -->
<!-- 12판 : 지역 판정에 시도 접두어 우선 — "경기 광주 / 경기도광주 / 경기도 광주시 / 경광" 은 경기도 광주시, 같은 이름(고성·중구·북구…)도 적힌 시도 안에서 찾는다 (classify · muniOf · normRegion) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KIWI 지역보기</title>
<style>
@font-face{font-family:'BMJUA';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/BMJUA.woff') format('woff');font-display:swap}
/* 공질 웹(qjweb.html)과 같은 톤·글꼴. 13판: 봇은 반복 횟수 자리만 치환하고 자료는 data.json 으로 따로 올린다 */
/* 레이아웃: PC 지도(좌)+명단(우) 2열, 폰 1열 탭 전환. 지도는 전국 → 권역 → 시도 → 북부/남부(잎) 로 파고들고, 잎 근처에서는 시군구 경계와 회원 위치 핀을 겹쳐 그린다 */
:root{
  --bg:#F3F4F7;--frame:#FAFAFC;--card:#FFFFFF;--surface:#EEF0F4;--ink:#272733;--ink2:#565665;--sub:#9294A0;--line:#E4E6EC;--line2:#F0F1F5;
  --kiwi:#91BD3B;--kiwi-d:#4A9A62;--kiwi-l:#EDF5DF;
  --sea:#CFE3F3;--sea-txt:#4E79A6;--border:#FFFFFF;--muni:#7A8699;--nk:#C9D1DC;--nk-txt:#5F6B7A;--pin:#E0453F;--pin-txt:#FFFFFF;
  --m:#4A8FD4;--f:#E58FB0;--x:#A6A8B3;
  /* 시도별 색 — 행정도 포스터 톤 */
  --c-서울:#FBFBF4;--c-경기:#F7C9A2;--c-인천:#F6F6EE;--c-강원:#D7DFA2;--c-충북:#F3BBCB;--c-충남:#95C5E7;--c-대전:#F7F7F0;--c-세종:#F0F0E6;
  --c-전북:#EAD8B6;--c-전남:#B9DDA9;--c-광주광역시:#F7F7F0;--c-경북:#DCC9E6;--c-경남:#B9BEE8;--c-대구:#F7F7F0;--c-부산:#F7F7F0;--c-울산:#F7F7F0;--c-제주:#BFDCEC;
  --disp:'BMJUA',sans-serif;--body:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --r:16px;--shadow:0 1px 2px rgba(24,24,34,.04),0 8px 26px rgba(24,24,34,.07)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171C;--frame:#1B1E24;--card:#22252C;--surface:#2A2E36;--ink:#ECEDF1;--ink2:#C3C5CE;--sub:#80838E;--line:#333740;--line2:#2B2F37;
  --kiwi:#9BC94A;--kiwi-d:#86B944;--kiwi-l:#2A3522;--sea:#17222E;--sea-txt:#6F94BF;--border:#0F141B;--muni:#9AA6B8;--nk:#2A3038;--nk-txt:#7C8796;--x:#5E616B;
  --c-서울:#3A3D40;--c-경기:#7E5A3E;--c-인천:#383B3F;--c-강원:#5E6A3C;--c-충북:#76484F;--c-충남:#355878;--c-대전:#3A3D40;--c-세종:#3A3D40;
  --c-전북:#6E5F43;--c-전남:#436543;--c-광주광역시:#3A3D40;--c-경북:#5E4C70;--c-경남:#464C76;--c-대구:#3A3D40;--c-부산:#3A3D40;--c-울산:#3A3D40;--c-제주:#3D566B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171C;--frame:#1B1E24;--card:#22252C;--surface:#2A2E36;--ink:#ECEDF1;--ink2:#C3C5CE;--sub:#80838E;--line:#333740;--line2:#2B2F37;
  --kiwi:#9BC94A;--kiwi-d:#86B944;--kiwi-l:#2A3522;--sea:#17222E;--sea-txt:#6F94BF;--border:#0F141B;--muni:#9AA6B8;--nk:#2A3038;--nk-txt:#7C8796;--x:#5E616B;
  --c-서울:#3A3D40;--c-경기:#7E5A3E;--c-인천:#383B3F;--c-강원:#5E6A3C;--c-충북:#76484F;--c-충남:#355878;--c-대전:#3A3D40;--c-세종:#3A3D40;
  --c-전북:#6E5F43;--c-전남:#436543;--c-광주광역시:#3A3D40;--c-경북:#5E4C70;--c-경남:#464C76;--c-대구:#3A3D40;--c-부산:#3A3D40;--c-울산:#3A3D40;--c-제주:#3D566B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);padding-inline:16px;padding-block:20px 40px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--kiwi-d);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;background:var(--frame);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.head{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 4px 4px}
.brand{font-family:var(--disp);font-size:20px;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--kiwi-d);letter-spacing:.08em}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface);padding:4px;border-radius:12px}
.tabs button{padding:6px 12px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:12.5px}
.tabs button.on{background:var(--card);color:var(--kiwi-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mock{font-size:11px;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:2px 9px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.ch h2{margin:0;font-size:14.5px;font-weight:700}
.ch .n{margin-left:auto;color:var(--sub);font-size:11.5px}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px}
.crumb button{padding:3px 8px;border-radius:8px;color:var(--ink2);font-weight:600}
.crumb button:hover{background:var(--surface)}
.crumb button.cur{background:var(--kiwi-l);color:var(--kiwi-d)}
.crumb .sep{color:var(--sub)}
/* 지도 */
.mapwrap{position:relative;background:var(--sea);aspect-ratio:400/500;max-height:720px;width:100%;touch-action:none;overflow:hidden}
.mapwrap svg{cursor:grab}.mapwrap.drag svg{cursor:grabbing}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.reg{stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:opacity .25s}
.reg:hover{filter:brightness(.94)}
.reg.dim{opacity:.38}
.reg.dim:hover{opacity:.6}
.reg.leafsel{stroke:var(--ink);stroke-width:1.6}
.muni{fill:transparent;stroke:var(--muni);stroke-opacity:.5;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.muni:hover{fill:rgba(0,0,0,.07)}
.muni.on{fill:var(--kiwi-d);fill-opacity:.32;stroke:var(--kiwi-d);stroke-opacity:1;stroke-width:1.4}
.nk{fill:var(--nk);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.nkh{fill:url(#hatch);pointer-events:none}
.other{fill:var(--nk);fill-opacity:.55;stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.lbl{font-family:var(--body);font-weight:700;fill:var(--ink);pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:var(--border);stroke-opacity:.9;stroke-linejoin:round}
.lbl .cnt{font-weight:600;fill:var(--ink2)}
.sea-l{font-family:var(--disp);fill:var(--sea-txt);text-anchor:middle;pointer-events:none;opacity:.9}
.sea-l .en{font-family:var(--body);font-style:italic;font-weight:500;opacity:.8}
.nk-l{font-family:var(--body);fill:var(--nk-txt);text-anchor:middle;pointer-events:none;font-weight:600;letter-spacing:.06em}
.isl{fill:var(--c-경북);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke}
.isl-l{font-family:var(--body);fill:var(--ink2);font-weight:600;pointer-events:none;text-anchor:middle}
.pin{cursor:pointer}
.pin circle{fill:var(--pin);stroke:var(--border);stroke-width:1.2;vector-effect:non-scaling-stroke}
.pin.on circle{fill:var(--kiwi-d)}
.pin text{font-family:var(--body);font-weight:700;fill:var(--pin-txt);text-anchor:middle;pointer-events:none}
.pin .nm{fill:var(--ink);text-anchor:start;font-weight:600;paint-order:stroke;stroke:var(--border);stroke-opacity:.9;stroke-linejoin:round}
.back{position:absolute;left:10px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:30px;height:30px;background:var(--card);border:1px solid var(--line);border-radius:9px;font-size:16px;font-weight:700;color:var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.legend{position:absolute;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:11px;color:var(--ink2);display:flex;flex-direction:column;gap:3px;max-width:46%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--sub);padding:9px 14px;border-top:1px solid var(--line2)}
/* 명단 */
.list{display:flex;flex-direction:column;max-height:760px}
.list .body{overflow:auto;padding:0 12px 14px;min-height:0}
.stat{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.chip.on{background:#FFF1DB;color:#B9741A;border-color:#E8C98F}
.pill.o{background:#FFF1DB;color:#B9741A}.pill.r{background:#FDE4E4;color:#C94441}
.chip b{font-weight:800}
.stat .k{flex:1 1 90px;background:var(--surface);border-radius:11px;padding:8px 11px;min-width:0}
.stat .k b{display:block;font-size:19px;font-family:var(--disp);line-height:1.1}
.stat .k span{font-size:11px;color:var(--sub)}
.sortrow{flex:1 1 100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sortrow label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;margin-left:auto}
.sortrow label input{accent-color:var(--kiwi-d);width:15px;height:15px;margin:0}
/* 표 형태 명단: 닉네임 · 연령 · 성별 · 혼인 · 지역 */
.thead,.tr{display:grid;grid-template-columns:minmax(0,1.3fr) 46px 40px 40px minmax(0,1.6fr);gap:6px;align-items:center;padding:7px 8px}
.thead{position:sticky;top:0;z-index:3;background:var(--card);font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.04em;border-bottom:1px solid var(--line);margin:0 0 2px;padding-top:10px;white-space:nowrap;box-shadow:0 -12px 0 0 var(--card)}
.thead button{text-align:left;font-weight:700;color:var(--sub);padding:2px 0}
.thead button.on{color:var(--kiwi-d)}
.tr{border-top:1px solid var(--line2);font-size:13px}
.tr .nk{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .c{color:var(--ink2);font-variant-numeric:tabular-nums}
.tr .g.m{color:var(--m)}.tr .g.f{color:var(--f)}
.tr .rg{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-width:0}
.tr .rg .raw{font-size:11px;color:var(--sub);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hp{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--surface);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.hp.last{background:var(--kiwi-l);color:var(--kiwi-d);border-color:var(--kiwi)}
.hp.muni{background:var(--ink);color:var(--card);border-color:var(--ink)}
.stp{font-size:10px;font-weight:700;padding:0 5px;border-radius:999px;margin-left:4px;vertical-align:1px}
.stp.away{background:#FFF1DB;color:#B9741A}.stp.out{background:#FDE4E4;color:#C94441}
/* 지역 묶음 헤더: 시도 색으로 음영, 스크롤 시 인덱스처럼 위에 붙는다 */
.gh{position:sticky;top:37px;z-index:2;display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--gh,var(--surface));border-left:4px solid var(--gc,var(--kiwi))}
.gh b{font-weight:800;color:var(--ink2)}
.gh button{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--kiwi-d)}
.tr.in-g{background:color-mix(in srgb,var(--gc,transparent) 7%,transparent)}
@media (max-width:820px){ .thead,.tr{grid-template-columns:minmax(0,1.2fr) 36px 28px 28px minmax(0,1.5fr);gap:4px;padding:7px 4px} .tr .rg .raw{display:none} .thead{top:0} .gh{top:37px} }.sortrow .lb{font-size:11px;color:var(--sub);font-weight:700;margin-right:2px}
.sortrow .chip.on{background:var(--kiwi-l);color:var(--kiwi-d);border-color:var(--kiwi)}
.filt{margin:10px 2px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--kiwi-l);border-radius:9px;padding:6px 10px}
.filt button{margin-left:auto;color:var(--kiwi-d);font-weight:600}
.grp{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.04em;margin:12px 2px 4px}
.grp button{color:var(--kiwi-d);font-weight:600;letter-spacing:0;margin-left:auto;font-size:11.5px}
.li{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;width:100%;text-align:left}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.center h1{font-family:var(--disp);font-weight:400;font-size:24px;margin:0}
.center input{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;text-align:center;font-size:16px}
.center .btn{font-size:13px;font-weight:700;padding:9px 15px;border-radius:11px;background:var(--kiwi);color:#fff;width:100%;max-width:340px}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(0,0,0,.12);border-top-color:var(--kiwi-d);animation:sp .7s linear infinite;vertical-align:-2px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.hintp{font-size:12px;color:var(--sub);margin:0}
.li+.li{border-top:1px solid var(--line2)}
.av{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;background:var(--m)}
.av.f{background:var(--f)}.av.x{background:var(--x)}
.tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx b{font-size:13.5px;font-weight:600}
.tx span{color:var(--sub);font-size:12px;margin-left:7px}
.pill{flex:none;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);color:var(--sub)}
.pill.g{background:var(--kiwi-l);color:var(--kiwi-d)}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:13px}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;line-height:1.5;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.toast.on{opacity:1}
.tband{position:fixed;left:0;right:0;top:0;z-index:70;padding:9px 16px;background:var(--kiwi-l);color:var(--kiwi-d);font-size:12.5px;font-weight:700;text-align:center;border-bottom:1px solid var(--line);opacity:0;transform:translateY(-100%);transition:opacity .2s,transform .2s;pointer-events:none}.tband.on{opacity:1;transform:none}
.tabs{display:none}
.tolist{display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);align-items:center;gap:6px;background:var(--ink);color:var(--card);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22);white-space:nowrap}
@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:12px;border-radius:18px;gap:10px}
  .mapwrap{aspect-ratio:auto;height:58vh;min-height:360px}
  .list{max-height:none}
  .list .body{overflow:visible}
  .tabs{display:none}
  .legend{max-width:60%;bottom:48px}
  .tolist{display:flex}
}

@media (prefers-reduced-motion:reduce){.reg{transition:none}}
</style>
</head>
<body data-kiwi-tpl="15">
<script>window.onerror=function(m,s,l){ try{ var d=document.getElementById("err")||document.createElement("div"); d.id="err"; d.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#B9741A;color:#fff;padding:10px 14px;border-radius:10px;font:12px/1.5 sans-serif;word-break:break-all"; d.textContent="페이지 오류: "+m+" ("+l+"행) — 이 문구를 봇 관리자에게 알려주세요"; document.body.appendChild(d);}catch(e){} };</script>
<div id="root"><div class="app view-map" id="app" hidden>
  <div class="head">
    <div class="brand"><small>🥝 KIWI 지역보기</small><span id="roomname"></span></div>
    <span class="mock" id="pubinfo"></span>
    <div class="tabs"><button id="tmap" class="on">🗺 지도</button><button id="tlist">📋 명단</button></div>
  </div>

  <section class="card mapcard">
    <div class="ch"><div class="crumb" id="crumb"></div><span class="n" id="mapn"></span></div>
    <div class="mapwrap" id="mapwrap">

/* ───────── 시작: 만료 → (대기) → 비밀번호 → 경계 자료 → 그리기 ───────── */
var root=document.getElementById("root");

function clearScreen(){ var old=document.getElementById("scr"); if(old) old.remove(); }
function fmtTime(sec){ var d=new Date(sec*1000); return (d.getMonth()+1)+"."+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function b2a(bytes){var s="";for(var i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);}
function a2b(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function key(pw,salt){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(k){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);});}
function unseal(obj,pw){return key(pw,a2b(obj.s)).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:a2b(obj.i)},k,a2b(obj.c));}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});}
function utf8dec(b64){ return JSON.parse(new TextDecoder().decode(a2b(b64))); }
function pubInfo(){ document.getElementById("pubinfo").textContent="공질 "+ALL.length+"건"+(nOut()?" (퇴장 "+nOut()+" 제외)":"")+" · "+fmtTime(P.pub||PUB)+" 기준 · "+fmtTime(EXP)+" 까지"; }
function start(p){ P=p; try{ var ss=String(localStorage.getItem("kiwi.map.sort")||"").split(":"); if(ss[0]==="name"||ss[0]==="age"||ss[0]==="gender"||ss[0]==="marry"){ SORT=ss[0]; DIR=ss[1]==="-1"?-1:1; } if(localStorage.getItem("kiwi.map.group")==="0") GROUP=false; }catch(e){}
  document.getElementById("roomname").textContent=P.room||ROOM;
  screen('<h1>지도를 불러오는 중</h1><p class="hintp"><span class="spin"></span>시군구 경계 자료 (약 300KB)</p>');
  fetch(GEO_URL+"?v=13",{cache:"force-cache"}).then(function(r){ if(!r.ok) throw new Error("["+r.status+"]"); return r.json(); }).then(function(g){
    GEO=g; PATHS=g.paths; CENTS=g.cents; MPATHS=g.mpaths; MCENTS=g.mcents; VB=g.vb; VIEW=homeView(); svg.setAttribute("viewBox",[VIEW.x,VIEW.y,VIEW.w,VIEW.h].join(" "));
    loadMembers(); pubInfo();
    clearScreen(); app.hidden=false; if(WAITING) watchNew(); render(); }).catch(function(e){ screen('<h1>지도 자료를 받지 못했습니다</h1><p class="hintp">'+esc(String(e.message||e))+' · 봇에서 .공질웹점검 으로 kr.json 업로드 상태를 확인해 주세요</p>'); }); }
/* 새 자료가 올라오면 새로고침 없이 그 자리에서 바꾼다 */

  go.onclick=tryOpen; pw.onkeydown=function(e){ if(e.key==="Enter") tryOpen(); }; pw.focus(); }
/* ───────── 시작 (13판 : data.json) ───────── */
var WANT=+((/[?&]v=(\d+)/.exec(location.search)||[])[1]||0), WAITING=false;

/* 처음 발행(자료가 아직 없음) — Pages 배포를 기다린다 */

  var n=0; (function tick(){ n++; var c=document.getElementById("c"); if(c) c.textContent="("+(n*4)+"초)";
    if(n>150){ screen('<h1>아직 올라오지 않았습니다</h1><p class="hintp">GitHub 배포가 평소보다 오래 걸리고 있습니다.</p><button class="btn" id="rt">다시 시도</button>'); document.getElementById("rt").onclick=function(){location.reload();}; return; }
    fetchData(function(d){ if(d&&d.pub) boot(d); else setTimeout(tick,4000); }); })(); }
/* 새 자료(WANT)가 올라올 때까지 토스트를 띄우고, 올라오면 그 자리에서 바꾼다 */

    fetchData(function(d){ if(d&&(d.pub||0)>=WANT){ payloadOf(d).then(function(p){ WAITING=false; toast("최신 자료로 바꿨습니다 ("+fmtTime(d.pub)+")",3000); applyData(d,p); if((d.tpl||0)>TPL) shellUpdate(d.tpl); }).catch(function(e){ if(WAITING) setTimeout(tick,5000); else console.error(e); }); } else setTimeout(tick,5000); }); })(); }
function shellUpdate(want){ var n=0; toast('<span class="spin"></span>새 화면 판('+want+')을 올리는 중입니다 — 준비되면 자동으로 새로고침합니다',0);
  (function tick(){ n++; if(n>150){ toast("새 화면이 아직 안 올라왔습니다. 잠시 뒤 새로고침해 주세요",6000); return; }
    fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.text():"";}).then(function(t){ var m=/data-kiwi-tpl="(\d+)"/.exec(t||""); if(m&&+m[1]>=want) location.replace(location.pathname+location.search.replace(/&r=\d+/,"")+"&r="+Date.now()); else setTimeout(tick,5000); }).catch(function(){ setTimeout(tick,5000); }); })(); }
function boot(d){ PUB=d.pub||0; EXP=d.exp||0; ROOM=d.room||""; PLAIN=!!d.plain; var now=Date.now()/1000;
  if((d.tpl||0)>TPL && !(WANT>PUB)) shellUpdate(d.tpl);          /* 새 자료는 이미 왔는데 껍데기만 옛 판 (자료도 아직이면 watchNew 가 맡는다) */
  WAITING = WANT>PUB;
  if(now>EXP && !WAITING){ screen('<h1>만료된 페이지입니다</h1><p class="hintp">방에서 .지역보기 를 다시 입력해 새 링크를 받아주세요.</p>'); return; }
  if(PLAIN){ PAYLOAD=null; start(utf8dec(d.b64)); return; }
  if(!window.crypto||!crypto.subtle){ screen('<h1>이 브라우저에서는 열 수 없습니다</h1><p class="hintp">Chrome · Safari 로 열어주세요</p>'); return; }
  PAYLOAD={s:d.s,i:d.i,c:d.c}; unlockScreen(""); }
fetchData(function(d){ if(d&&d.pub) boot(d); else waitFirst(); });
})();
