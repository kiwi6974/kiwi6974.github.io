<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KIWI 공질</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11161c;color:#c9d3de;
font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;text-align:center;padding:0 20px}p{margin:6px;line-height:1.6}
button{margin-top:14px;padding:9px 18px;border:0;border-radius:10px;background:#91BD3B;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.sp{display:inline-block;width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);border-top-color:#91BD3B;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}</style></head>
<body data-kiwi-expired="1791904843"><div><h2 id="h">만료된 페이지입니다</h2>
<p id="m">방에서 <b>.공질관리 → 12. 웹에서 관리</b> 로 새 링크를 받아주세요.</p></div>
<script>(function(){
var v=+((/[?&]v=(\d+)/.exec(location.search)||[])[1]||0),h=document.getElementById('h'),m=document.getElementById('m');
if(!v)return;
h.textContent='새 페이지를 올리는 중입니다';
m.innerHTML='<span class="sp"></span>잠시만 기다리면 자동으로 열립니다 <span id="c"></span><br><small>보통 30초~1분 걸립니다</small>';
var n=0,ready=false;
function go(){location.replace(location.pathname+'?v='+v+'&r='+Date.now());}
function fail(){h.textContent='아직 올라오지 않았습니다';m.innerHTML='GitHub 배포가 평소보다 오래 걸리고 있습니다.<br><button onclick="location.reload()">다시 시도</button>';}
function later(){setTimeout(tick,4000);}
function checkIndex(){fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){var p=/data-kiwi-pub="(\d+)"/.exec(t||'');if(p&&+p[1]>=v)go();else later();}).catch(later);}
function tick(){n++;var c=document.getElementById('c');if(c)c.textContent='('+(n*4)+'초)';if(n>150){fail();return;}
if(ready){checkIndex();return;}
fetch('meta.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&(j.pub||0)>=v){ready=true;checkIndex();}else later();}).catch(later);}
tick();
})();</script></body></html>
