<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>KIWI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>@keyframes sp{to{transform:rotate(360deg)}}
.sp{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(0,0,0,.12);
border-top-color:#4DA369;animation:sp .8s linear infinite;margin:18px auto 0;display:none}</style>
</head><body style="margin:0;min-height:100vh;display:flex;flex-direction:column;
align-items:center;justify-content:center;background:#FFFCEB;font-family:Pretendard,sans-serif;
color:#282832;text-align:center;padding:40px">
<div style="font-size:44px;margin-bottom:16px">&#129437;</div>
<h2 id="t" style="font-size:21px;font-weight:800">만료된 리포트입니다</h2>
<p id="d" style="font-size:13px;color:#9A947A;font-weight:600;margin-top:10px;line-height:1.7">
보안을 위해 이 리포트는 자동으로 만료되었습니다.<br>
카카오톡에서 <b>.전체톡수</b> 를 입력하면<br>새 링크를 받을 수 있어요.</p>
<div class="sp" id="s"></div>
<script>
/* 새 리포트가 배포되면 스스로 넘어간다.
   발행 직후에는 아직 이 만료 페이지가 서빙되므로, 그대로 두면
   방금 받은 링크인데도 '만료'로 보인다. */
var PUB = 1788490930;
var WANT = +(new URLSearchParams(location.search).get("v") || 0);
if (WANT > PUB) {
  document.getElementById("t").textContent = "새 리포트를 준비하는 중입니다";
  document.getElementById("d").innerHTML = "잠시만 기다려주세요";
  document.getElementById("s").style.display = "block";
}
function chk(){
  fetch("./meta.json?_=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(m){
      if (m && m.pub > PUB && m.exp > Date.now()/1000)
        location.replace(location.pathname + "?v=" + m.pub + location.hash);
    })
    .catch(function(){});
}
setInterval(chk, 5000); chk();
</script>
</body></html>
