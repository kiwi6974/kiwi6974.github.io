<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>KIWI봇 설정</title>
<!-- KIWI-BOTCFG:5  —  껍데기 템플릿. 방·자료와 무관하며 자료는 같은 폴더의 key.json / data.json 을 GitHub API 로 읽는다.
     k00_봇설정웹 v005 · 비밀번호 → PBKDF2(250000)+AES-GCM 복호화 → 스키마(카테고리→기능 카드→팝업 필드) 렌더 → 저장은 inbox.json
     유효기간 없음 (비밀번호가 맞으면 계속 열림 · 30일마다 비밀번호 변경 안내) -->
<style>
/* 1400px · 좌측 카테고리 레일 + 우측 기능 카드(제목 옆 ON/OFF). 세부 설정은 팝업(딤+블러). 밝은 청회색 바탕 + 흰 카드 */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --line:#E3E7EE; --fg:#1F2430; --muted:#7B8494; --muted2:#B7BEC9;
  --accent:#3E9F62; --accent-soft:#E2F3E8; --master:#3B6BC2; --master-soft:#E1EAFB; --off:#CBD2DC; --warn:#E8923A; --warn-soft:#FDEFDD; --danger:#E25555; --danger-soft:#FCE6E6;
  --chip:#F3F5F9; --sub:#F8F9FC; --shadow:0 1px 2px rgba(30,40,60,.05),0 8px 24px rgba(30,40,60,.06);
  --font:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;min-height:100vh}
body.lock{overflow:hidden}
[hidden]{display:none!important}
.wrap{max-width:1400px;margin:0 auto}
select,button,input,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=password],textarea{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
textarea{line-height:1.55}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}

/* 헤더 */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:18px 0 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .k{font-size:26px}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 7px}
.tag.m{background:var(--master-soft);color:var(--master)}.tag.h{background:var(--accent-soft);color:var(--accent)}
.roomname{font-size:15px;font-weight:800;letter-spacing:-.01em;padding-left:12px;border-left:2px solid var(--line)}
.roomname small{font-weight:700;color:var(--muted);font-size:12.5px}
.right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crown{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;font-size:12px;color:var(--muted);font-weight:600}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.pill.off i{background:var(--off)}.pill.warn i{background:var(--warn)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid #F3D9B8;border-radius:12px;padding:10px 14px;font-size:13px;margin:0 0 14px;animation:rise .35s both}
.banner .t{flex:1;min-width:220px}.banner b{font-weight:800}

/* 레일 */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start}
nav.rail{position:sticky;top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 24px);overflow-y:auto;box-shadow:var(--shadow)}
nav.rail .grp{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding:10px 10px 4px}
nav.rail .sp{flex:1;min-height:8px}
nav.rail button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--fg);transition:background .15s}
nav.rail button .ico{font-size:16px;width:22px;text-align:center}
nav.rail button .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.rail button .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
nav.rail button:hover{background:var(--chip)}
nav.rail button.on{background:var(--chip)}
nav.rail button.on .n{color:var(--accent)}
nav.rail button.spy{background:var(--accent-soft)}
nav.rail button.spy .n{color:var(--accent)}
nav.rail button.dim .n{color:var(--muted);font-weight:600}
.msel{display:none;width:100%;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;margin-bottom:12px}
@media(max-width:860px){.shell{grid-template-columns:1fr}nav.rail{display:none}.msel{display:block}}

/* 본문 */
main{min-width:0}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 12px;animation:rise .3s both}
.ph .ico{font-size:28px;line-height:1.2}
.ph h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.ph .mod{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.ph .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.sec{margin:0 0 12px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;scroll-margin-top:12px;animation:rise .3s both}
.sec h2{margin:0;font-size:17px;font-weight:800}
.sec .mod{font-size:11px;color:var(--muted);font-family:var(--mono)}
.sec .jump{margin-left:auto;font-size:12px;color:var(--master);background:none;border:0;cursor:pointer;font-weight:700}
.hr{height:2px;background:linear-gradient(90deg,var(--line),transparent);margin:30px 0}
.spypad{height:calc(100vh - 240px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.grid .gh{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);padding:10px 2px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 13px 10px;display:flex;flex-direction:column;gap:7px;min-width:0;
  animation:rise .38s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
.still .card,.still .ph,.still .sec{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.locked{opacity:.5}
.card.off{background:#FBFCFD}
.card.chg{border-color:var(--warn)}
.card .ch{display:flex;align-items:center;gap:10px}
.card .ch .ico{font-size:17px;flex:none}
.card .ch b{flex:1;min-width:0;font-size:14px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .desc{font-size:11.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.card .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px;padding-top:6px;border-top:1px solid var(--line)}
.card .kv .k{color:var(--muted)}.card .kv .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .kv .v.on{color:var(--accent)}.card .kv .v.offv{color:var(--muted2)}
.card .cf{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:2px}
.card .cf .sp{flex:1}
.badge{font-size:10px;border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px;font-weight:700;white-space:nowrap}
.badge.lock{color:var(--master);border:1px solid var(--master)}
.badge.new{color:var(--accent);border:1px solid var(--accent)}
.badge.adv{color:var(--muted);background:var(--chip)}
.badge.chg{color:var(--warn);border:1px solid var(--warn)}
.gear{border:1px solid var(--line);background:var(--card);border-radius:9px;height:28px;padding:0 10px;cursor:pointer;font-size:12px;font-weight:700;flex:none;display:inline-flex;align-items:center;gap:6px}
.gear:hover{background:var(--chip)}
.sw{position:relative;width:42px;height:25px;flex:none;border-radius:999px;background:var(--off);border:0;cursor:pointer;transition:background .18s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{transform:translateX(17px)}
.sw.blue[aria-checked="true"]{background:var(--master)}
.sw:disabled{cursor:not-allowed;opacity:.55}
.sw.sm{width:38px;height:23px}.sw.sm::after{width:17px;height:17px}.sw.sm[aria-checked="true"]::after{transform:translateX(15px)}
.mini{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 11px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
.mini.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mini.blue{background:var(--master);border-color:var(--master);color:#fff}
.mini.dan{color:var(--danger);border-color:var(--danger)}
.mini:disabled{opacity:.45;cursor:not-allowed}
.lockbtn{border:0;background:transparent;cursor:pointer;font-size:13px;padding:3px;border-radius:8px;line-height:1;opacity:.3;flex:none}
.lockbtn[aria-pressed="true"]{opacity:1;background:var(--master-soft)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px}
.row .ico{font-size:18px;width:26px;text-align:center;flex:none}
.row .t{flex:1;min-width:180px}.row .t b{display:block;font-weight:700;font-size:14px}.row .t small{display:block;color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:4px 0 6px;width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--muted);letter-spacing:.04em;font-weight:800;background:var(--sub);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td .w{color:var(--warn);font-weight:700}td .d{color:var(--danger);font-weight:700}td .g{color:var(--accent);font-weight:700}
.tnote{font-size:12px;color:var(--muted);padding:2px 2px 4px}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.op{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;animation:rise .35s both}
.op .l{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.op .v{font-size:15px;font-weight:800;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.op .v i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.op .v i.d{background:var(--danger)}.op .v i.w{background:var(--warn)}
.op small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.bars{display:inline-flex;gap:3px;vertical-align:middle}
.bars i{width:9px;height:9px;border-radius:2px;background:var(--accent);display:block}
.bars i.o{background:var(--off)}.bars i.p{background:var(--warn)}
.tree{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;animation:rise .3s both}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border:0}
.tree li{padding:2px 0;font-size:13.5px}
.tree li>b{font-weight:800}
.tree .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.tree .s{color:var(--muted);font-size:12px;margin-left:6px}
.tree .leaf{font-size:12.5px}
.tree .ty{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:4px;font-family:var(--mono)}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px rgba(30,40,60,.06);z-index:5}
.bar .in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .st{font-size:13px;color:var(--muted);font-weight:600;flex:1;min-width:140px}.bar .st b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.blue{background:var(--master);border-color:var(--master);color:#fff}
.btn.dan{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:default}

/* 팝업 */
.modal{position:fixed;inset:0;background:rgba(20,28,45,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;animation:fade .2s both}
.modal.top{z-index:30}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.modal .box{background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:680px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:pop .28s cubic-bezier(.2,.7,.2,1) both}
.modal .box.sm{max-width:400px}
.modal .box.xl{max-width:1180px}
/* 팝업 크기 고정 — 화면 위아래에 여백을 두고, 내용이 많든 적든 같은 높이 (본문만 스크롤) */
.modal .box:not(.sm){height:min(820px,calc(100vh - 2*clamp(16px,7vh,64px)))}
.modal .box.xl:not(.sm){height:min(940px,calc(100vh - 2*clamp(16px,6vh,56px)))}
@supports(height:100dvh){.modal .box:not(.sm){height:min(820px,calc(100dvh - 2*clamp(16px,7vh,64px)))}.modal .box.xl:not(.sm){height:min(940px,calc(100dvh - 2*clamp(16px,6vh,56px)))}}
@media(max-width:640px){.modal{padding:10px}.modal .box:not(.sm),.modal .box.xl:not(.sm){height:calc(100vh - 20px);max-height:calc(100vh - 20px)}
  @supports(height:100dvh){.modal .box:not(.sm),.modal .box.xl:not(.sm){height:calc(100dvh - 20px);max-height:calc(100dvh - 20px)}}}
/* 표·공질웹 하나만 있는 팝업 — 탭·검색은 고정, 목록만 스크롤 */
.modal .mb.solo{display:flex;flex-direction:column;overflow:hidden}
.modal .mb.solo>.f{flex:1;min-height:0;border-bottom:0;align-items:stretch;flex-wrap:nowrap;padding-bottom:4px}
.mb.solo [data-tt]{display:flex;flex-direction:column;min-height:0;flex:1}
.mb.solo [data-ttbody]{flex:1;min-height:0;overflow:auto}
.mb.solo .qjw{flex:1;min-height:0;height:100%}
.mb.solo .qjlist ul{max-height:none}
.mb.solo .qjbody textarea{min-height:0}
/* 긴 표는 여러 단으로 나눠 세로 길이를 줄인다 */
.ttgrid{display:grid;grid-template-columns:repeat(var(--k,2),minmax(0,1fr));gap:10px;align-items:start}
.ttgrid .tablewrap{margin:0}
.ttgrid td,.ttgrid th{padding:6px 9px}
td.no,th.no{color:var(--muted);font-family:var(--mono);font-size:11px;width:1%;padding-right:4px}
.modal .mh{padding:18px 22px 10px;border-bottom:1px solid var(--line)}
.modal h2{margin:0 0 2px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal .mh p{margin:0;color:var(--muted);font-size:12.5px;font-weight:600;line-height:1.5}
.modal .mb{padding:8px 16px;overflow-y:auto;flex:1;min-height:0}
.modal .mf{padding:12px 22px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal .mf .l{margin-right:auto;font-size:12px;color:var(--muted);font-family:var(--mono)}
.modal .err{color:var(--danger);font-size:13px;font-weight:700;min-height:18px;margin-top:8px}
.modal .lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.modal .box.sm input{width:100%;padding:11px 12px;font-size:15px}
.modal .box.sm textarea{width:100%;min-height:140px}
.hostnote{font-size:12.5px;line-height:1.7;font-weight:600;color:var(--warn);background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.f{display:flex;align-items:center;gap:12px;padding:9px 6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f .t{flex:1;min-width:170px}.f .t b{display:block;font-size:13.5px;font-weight:700}.f .t small{display:block;color:var(--muted);font-size:12px}
.f .t.full{flex-basis:100%}
.f.locked{opacity:.5}
.f.ghr{border-bottom:0;padding-bottom:0}
.f .gh{width:100%;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);padding-top:8px}
.f textarea{flex-basis:100%;width:100%;min-height:58px;resize:vertical;font-size:13px}
.f input[type=text]{flex-basis:100%;width:100%}
.f input[type=number]{width:120px}
.f .val{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.f input[type=range]{width:180px;accent-color:var(--accent)}
.f .ro{font-size:13px;font-weight:700;color:var(--muted);text-align:right;max-width:62%}
.f pre.ro{flex-basis:100%;max-width:100%;text-align:left;white-space:pre-wrap;font-family:var(--font);font-weight:500;color:var(--fg);background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;font-size:13px;line-height:1.6}
.steps{width:100%;display:grid;gap:8px}
.step{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--sub);transition:opacity .15s}
.step .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .sh b{font-size:13.5px}
.step .sh small{flex:1;min-width:140px;color:var(--muted);font-size:12px}
.step .sh .ord{font-family:var(--mono);font-size:11px;color:var(--muted);width:18px}
.step .sh .mv{border:1px solid var(--line);background:var(--card);border-radius:6px;width:26px;height:24px;cursor:pointer;font-size:11px;padding:0}
.step .sh .mv:disabled{opacity:.3;cursor:default}
.step .lbl{margin:8px 0 2px}
.step textarea{width:100%;min-height:44px;font-size:13px;resize:vertical}
.step.off{opacity:.55}
.glopt{flex-basis:100%;padding:8px 0 2px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.glopt input[type=number]{width:90px}
.glslot{display:flex;align-items:center;gap:8px;padding:5px 0;flex-basis:100%}
.glslot b{width:46px;font-size:13px}
.pwbox{width:100%}.pwbox input{width:100%}.pwbox .hint{font-size:12px;color:var(--muted);margin-top:8px}
.qjw{display:grid;grid-template-columns:170px 300px minmax(0,1fr);gap:12px;width:100%;min-height:440px}
@media(max-width:900px){.qjw{grid-template-columns:1fr}}
.qjmenu{display:flex;flex-direction:column;gap:4px}
.qjmenu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.qjmenu button.on{background:var(--accent-soft);color:var(--accent)}
.qjmenu .qjinfo{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6;padding:8px 12px;background:var(--sub);border-radius:10px}
.qjlist{border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:0}
.qjlist ul{list-style:none;margin:0;padding:4px;overflow-y:auto;max-height:380px;flex:1}
.qjlist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
.qjlist li:hover{background:var(--chip)}.qjlist li.on{background:var(--accent-soft)}
.qjlist li .n{font-weight:800}.qjlist li .m{color:var(--muted);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qjtools{display:flex;gap:8px;align-items:center;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.qjtools.head{border-top:0;border-bottom:1px solid var(--line)}
.qjtools .sp{flex:1}.qjtools input[type=text]{flex:1;min-width:120px}
.qjbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.qjbody .qjhead b{font-size:15px;display:block}.qjbody .qjhead .m{font-size:12px;color:var(--muted)}
.qjbody textarea{flex:1;min-height:320px;width:100%;font-size:13.5px;line-height:1.6;resize:vertical}
.qjbody .empty{color:var(--muted);padding:40px 10px;text-align:center}
.qjtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;width:100%}
.qjtabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
.qjtabs button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qjtabs .sp{flex:1}

/* 게이트 */
.gate{min-height:76vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 0}
.gate .box{max-width:380px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px 24px;animation:pop .35s both}
.gate .k{font-size:44px;margin-bottom:10px}
.gate h1{font-size:19px;margin:0 0 6px;font-weight:800}
.gate p{color:var(--muted);font-size:13px;font-weight:600;line-height:1.7;margin:0 0 16px}
.gate input{width:100%;padding:12px 14px;font-size:16px;text-align:center;letter-spacing:.06em;margin-bottom:8px}
.gate .btn{width:100%;margin-top:4px}
.gate .err{color:var(--danger);font-size:13px;font-weight:700;min-height:20px;margin-top:8px}
.gate .link{background:none;border:0;color:var(--master);font-weight:700;font-size:13px;cursor:pointer;margin-top:12px;text-decoration:underline}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:16px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
/* 토스트 — 화면 가운데 크게 · 아무 데나 누르면 바로 닫힘 */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);background:rgba(28,36,52,.94);color:#fff;
  padding:20px 26px 28px;border-radius:18px;font-size:16px;font-weight:800;line-height:1.55;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s,transform .25s cubic-bezier(.2,.7,.2,1),visibility 0s .25s;width:max-content;min-width:min(280px,calc(100vw - 40px));max-width:min(460px,calc(100vw - 40px));
  text-align:center;z-index:60;box-shadow:0 24px 60px rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);word-break:keep-all;overflow-wrap:anywhere}
.toast.show{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1);transition:opacity .2s,transform .25s cubic-bezier(.2,.7,.2,1)}
.toast.ok{background:rgba(46,125,76,.96)}.toast.err{background:rgba(196,60,60,.96)}
.toast.refresh{background:rgba(42,74,140,.96)}
.toast .ti{font-size:30px;line-height:1;margin-bottom:8px}
.toast small{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:6px}
.toast .tb{margin-top:14px;display:flex;gap:8px;justify-content:center}
.toast .tb button{border:0;border-radius:10px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:#2A4A8C}
.toast .tb button.g{background:rgba(255,255,255,.18);color:#fff}
.toast .tbar{position:absolute;left:18px;right:18px;bottom:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.toast .tbar i{display:block;height:100%;background:rgba(255,255,255,.85);transform-origin:left;animation:tbar linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div id="gate" class="gate"><div class="box"><div class="k">🥝</div><h1 id="gTitle">KIWI봇 설정</h1><p id="gText">준비하는 중…</p><div id="gSpin" class="spin"></div>
  <form id="gForm" hidden>
    <input id="gId" type="text" autocomplete="username" placeholder="아이디" hidden>

  </form>

<div id="app" hidden>
<header>
  <div class="brand"><span class="k">🥝</span><span id="title">KIWI봇 설정</span> <span id="roleTag" class="tag h">HOST</span></div>
  <span class="roomname" id="roomName"></span>
  <select id="roomSel" aria-label="방 선택" hidden></select>
  <div class="right">

    <button class="mini" id="pwBtn">비밀번호 변경</button>

  </div>
</header>
<div class="meta" id="meta"></div>
<div class="banner" id="pwBanner" hidden><span>🔑</span><div class="t"><b>비밀번호를 바꾼 지 <span id="pwDays"></span>일 지났어요.</b> 30일마다 바꾸는 것을 권장합니다. 무시해도 페이지는 계속 쓸 수 있어요.</div><button class="mini pri" id="pwGo">지금 바꾸기</button><button class="mini" id="pwLater">나중에</button></div>

</div>
</div>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <div class="st" id="st">변경 사항 없음</div>
  <button class="btn" id="reset" disabled>되돌리기</button>
  <button class="btn pri" id="save" disabled>저장</button>
</div></div>

<div class="modal" id="cfgModal" hidden><div class="box">
  <div class="mh"><h2 id="cfgTitle"></h2><p id="cfgDesc"></p></div>
  <div class="mb" id="cfgBody"></div>
  <div class="mf"><span class="l" id="cfgFile"></span><button type="button" class="btn" id="cfgCancel">취소</button><button type="button" class="btn pri" id="cfgOk">확인</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const TPL = 5, ITER = 250000, PAGE_SIG = "5484ac3fe769", OPENED_AT = Date.now(), STALE_MIN = 60;
const normPw = p => { p = String(p||"").trim(); return /^[\d\s\-.]+$/.test(p) ? p.replace(/\D/g, "") : p; };   // k00 norm_pw 와 같은 규칙
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = { to: u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); }, from: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
const qs = new URLSearchParams(location.search);
const BASE = location.pathname.replace(/[^/]*$/, "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const J = v => JSON.stringify(v ?? null);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
                sget(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }, sset(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} }, sdel(k){ try { sessionStorage.removeItem(k); } catch(e){} } };
const isMobile = () => window.matchMedia("(max-width:860px)").matches;

// ── 암호화 (k00 seal/unseal 과 같은 규격) ──
async function deriveKey(pw, salt){
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt, iterations:ITER}, km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function unseal(obj, pw){
  const key = await deriveKey(pw, b64.from(obj.s));
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64.from(obj.i)}, key, b64.from(obj.c));
  return JSON.parse(dec.decode(pt));
}
async function seal(payload, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(payload))));
  return {s:b64.to(salt), i:b64.to(iv), c:b64.to(ct)};
}

// ── GitHub contents API ──
let GH = null;
async function gh(method, path, body){
  return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}${method==="GET"?`?ref=${GH.branch}&t=${Date.now()}`:""}`, {
    method, headers:{Authorization:`Bearer ${GH.token}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(body?{"Content-Type":"application/json"}:{})},
    body: body?JSON.stringify(body):undefined, cache:"no-store"});
}
async function ghReadJson(path){
  const r = await gh("GET", path);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  const j = await r.json();
  return {sha:j.sha, json:JSON.parse(dec.decode(b64.from((j.content||"").replace(/\n/g,""))))};
}
async function ghWriteJson(path, obj, sha, message){
  const body = {message, branch:GH.branch, content:b64.to(enc.encode(JSON.stringify(obj)))};
  if (sha) body.sha = sha;
  const r = await gh("PUT", path, body);
  if (r.status === 409 || r.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
  if (!r.ok) throw new Error(`저장 실패 (GitHub ${r.status})`);
}
// inbox 에 ops 를 더한다 — 봇이 아직 안 가져간 inbox 가 있으면 합친다 (덮어쓰면 앞 변경이 사라지므로)
async function queueOps(ops){
  const by = MODE === "master" ? "두리" : (P.room.host || "방장");
  for (let attempt = 0; attempt < 3; attempt++) {
    let cur = null, prev = [];
    try { cur = await ghReadJson(GH.inbox); } catch(e){}
    if (cur) { try { prev = (await unseal(cur.json, PW)).ops || []; } catch(e){ try { prev = PW_NEXT ? (await unseal(cur.json, PW_NEXT)).ops || [] : []; } catch(_){ prev = []; } } }
    try {
      await ghWriteJson(GH.inbox, await seal({by, mode:MODE, ops:[...prev, ...ops], at:Math.floor(Date.now()/1000)}, PW), cur && cur.sha, `botcfg inbox ${MODE}`);
      activeAt = Date.now(); schedulePoll();
      return;
    } catch(e){ if (!e.conflict || attempt === 2) throw e; }
  }
}

// ── 게이트 ──
let PW = "", PW_NEXT = "", KEY = null, P = null, MODE = "host";   // PW_NEXT: 비밀번호 변경 요청 뒤 봇이 새 비밀번호로 재발행할 때까지 대기
const gate = (title, text, spin) => { $("gTitle").textContent = title; $("gText").textContent = text; $("gSpin").hidden = !spin; };
async function fetchLocal(name){ const r = await fetch(`${BASE}${name}?t=${Date.now()}`, {cache:"no-store"}); if (r.status===404) return null; if(!r.ok) throw new Error(name+" "+r.status); return r.json(); }
const MASTER_TRY = "kiwi.botcfg.master.try";
async function boot(){
  try {
    const meta = await fetchLocal("meta.json");
    if (meta && meta.expired) { gate("닫힌 페이지", "이 설정 페이지는 닫혔습니다. 채팅에서 .봇설정 (또는 .마스터설정) 을 쳐서 새 링크를 받으세요.", false); return; }
    const key = await fetchLocal("key.json");
    const wantK = qs.get("k"), wantV = +(qs.get("v") || 0);
    // k 가 다른데 페이지가 링크보다 새로 발행됐으면 = 비밀번호가 바뀐 것 → 기다리지 않고 지금 페이지로 (예전 링크도 계속 쓰게)
    if (!key || (wantK && key.kid !== wantK && !(meta && +meta.pub >= wantV))) { gate("준비하는 중", "페이지가 아직 배포되고 있습니다. 30초~1분 뒤 자동으로 다시 시도합니다.", true); setTimeout(boot, 15000); return; }
    KEY = key; MODE = key.mode === "master" ? "master" : "host";
    $("gSpin").hidden = true; $("gForm").hidden = false;
    if (MODE === "master") {
      gate("KIWI 마스터 콘솔", "두리만 들어갈 수 있습니다.", false);
      $("gId").hidden = false; $("gBtn").textContent = "들어가기"; $("gBtn").className = "btn blue";
      const t = store.sget(MASTER_TRY); if (t) { store.sdel(MASTER_TRY); $("gId").value = t; $("gPw").value = t; return open(); }
      $("gId").focus();
    } else {
      gate(`KIWI봇 설정 · ${key.room || ""}`, "이 방의 비밀번호를 입력하세요.", false);
      $("gMaster").hidden = false; $("gPw").focus();
    }
    const saved = store.sget("kiwi.botcfg.pw." + key.kid); if (saved) { $("gPw").value = saved; open(); }
  } catch(e) { gate("열 수 없음", "자료를 읽지 못했습니다: " + e.message, false); }
}
$("gForm").addEventListener("submit", e => { e.preventDefault(); open(); });
async function open(){
  if (MODE === "master" && normPw($("gId").value) !== normPw($("gPw").value)) { $("gErr").textContent = "아이디 또는 비밀번호가 맞지 않습니다."; return; }
  const pw = normPw($("gPw").value); if (!pw) { $("gErr").textContent = "비밀번호를 입력하세요."; return; }
  $("gErr").textContent = ""; $("gSpin").hidden = false;
  try {
    GH = await unseal(KEY, pw); PW = pw;
    store.sset("kiwi.botcfg.pw." + KEY.kid, pw);
    await load(true);
  } catch(e) {
    $("gSpin").hidden = true;
    $("gErr").textContent = GH ? ("불러오기 실패: " + e.message) : (MODE === "master" ? "아이디 또는 비밀번호가 맞지 않습니다." : "비밀번호가 맞지 않습니다.");
    GH = null;
  }
}
// 마스터 로그인 팝업 (방장 페이지·게이트에서) — 아이디와 비밀번호를 똑같이 넣으면 마스터 페이지로 넘어가 그 값으로 연다
function masterLogin(){
  modal({title:"🔑 마스터 콘솔", desc:"두리만 들어갈 수 있습니다.", size:"sm",
    body:`<label class="lbl" for="mId">아이디</label><input id="mId" type="text" autocomplete="username" placeholder="아이디"><label class="lbl" for="mPw">비밀번호</label><input id="mPw" type="password" autocomplete="current-password" placeholder="비밀번호"><div class="err" id="mErr"></div>`,
    ok:"들어가기", okClass:"blue",
    onOk: () => { const id = normPw($("mId").value), pw = normPw($("mPw").value);
      if (!id || !pw) { $("mErr").textContent = "아이디와 비밀번호를 입력하세요."; return false; }
      if (id !== pw) { $("mErr").textContent = "아이디 또는 비밀번호가 맞지 않습니다."; return false; }
      store.sset(MASTER_TRY, pw); location.href = BASE + "../master/"; return true; },
    focus:"mId"});
}
$("gMaster").onclick = masterLogin; $("toMaster").onclick = masterLogin;
$("logout").onclick = () => { if (KEY) store.sdel("kiwi.botcfg.pw." + KEY.kid); location.reload(); };

// ── 자료 · 상태 ──
let state = {}, sel = "", cat = "", lastPub = 0, pollTimer = null, activeAt = Date.now();
const catOf = id => P.schema.find(c => c.id === id);
const rowKey = (c, r) => `${c.id}.${r.id}`;
const fKey = (c, f) => `${c.id}.${f.key}`;
const roomOf = rid => (P.mode === "master" ? P.rooms : [P.room]).find(r => r.id === rid);
function initState(){
  state = {};
  (P.mode === "master" ? P.rooms : [P.room]).forEach(r => {
    const v = JSON.parse(J(r.values || {}));
    state[r.id] = {room:r, v, orig:JSON.parse(J(v)), perm:{...(r.perm||{})}, permOrig:{...(r.perm||{})}, locks:new Set(r.locks||[]), locksOrig:new Set(r.locks||[])};
  });
}
async function load(first){
  const d = await ghReadJson(GH.data);
  if (!d) throw new Error("자료(data.json)가 없습니다 — 닫혔거나 아직 올라오는 중");
  let payload;
  try { payload = await unseal(d.json, PW); }
  catch(e) {
    if (!PW_NEXT) throw e;
    payload = await unseal(d.json, PW_NEXT);       // 봇이 새 비밀번호로 재발행함 → 이제부터 새 비밀번호로 봉인
    PW = PW_NEXT; PW_NEXT = ""; store.sset("kiwi.botcfg.pw." + KEY.kid, PW);
    try { const k2 = await fetchLocal("key.json"); if (k2) KEY = k2; } catch(_){}
  }
  if ((payload.tpl||0) > TPL) { location.reload(); return; }
  if (payload.sig) LATEST_SIG = payload.sig;
  const pending = Object.keys(state).some(id => changes(id) > 0);
  if (!first && payload.pub === lastPub) return;
  if (!first && pending) { toast("봇이 자료를 갱신했지만 저장 전 변경이 있어 유지합니다"); lastPub = payload.pub; return; }
  P = payload; lastPub = payload.pub; MODE = payload.mode;
  const rooms = P.mode === "master" ? P.rooms : [P.room];
  if (!sel || !rooms.some(r => r.id === sel)) sel = rooms[0] ? rooms[0].id : "";
  initState();
  if (first) { cat = isMobile() ? "all" : (P.mode === "master" ? "home" : P.schema[0].id); $("gate").hidden = true; $("app").hidden = false; $("bar").hidden = false; }
  render(!first);
  if (!first) toast("✅ 봇이 반영했습니다 — 최신 설정으로 갱신");
  schedulePoll();
  if (!first) setTimeout(checkStale, 5500);
}
function schedulePoll(){
  clearTimeout(pollTimer);
  const fast = Date.now() - activeAt < (P.fastWindow || 3600) * 1000;
  const sec = Math.max(15, fast ? (P.poll || 20) : (P.pollSlow || 120));
  pollTimer = setTimeout(async () => { try { await load(false); } catch(e){} schedulePoll(); }, sec * 1000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && P) { activeAt = Date.now(); load(false).catch(()=>{}); schedulePoll(); } });

// ── 보이기 · 잠금 ──
const S = () => state[sel];
const R = () => S().room;
const isM = () => MODE === "master";
const vis = x => isM() || !x.adv;
const catLocked = c => !isM() && S().perm[c.id] === false;
const rowLocked = (c, r) => !isM() && (catLocked(c) || r.lock || S().locks.has(rowKey(c, r)));
const fieldLocked = (c, r, f) => !isM() && (catLocked(c) || r.lock || f.lock || S().locks.has(rowKey(c, r)) || S().locks.has(fKey(c, f)));
const view = name => (R().views || {})[name];
const hasToggle = r => !!r.store;

function changes(rid){ const s = state[rid]; if (!s) return 0;
  let n = Object.keys(s.v).filter(k => J(s.v[k]) !== J(s.orig[k])).length;
  n += Object.keys(s.perm).filter(k => !!s.perm[k] !== !!s.permOrig[k]).length;
  n += [...s.locks].filter(k => !s.locksOrig.has(k)).length + [...s.locksOrig].filter(k => !s.locks.has(k)).length;
  return n; }

function buildOps(){
  const ops = [];

    Object.keys(s.v).forEach(k => { if (J(s.v[k]) !== J(s.orig[k])) { const i = k.indexOf("."); ops.push({room:rid, cat:k.slice(0,i), key:k.slice(i+1), value:s.v[k]}); } });
    if (isM()) {

      if (Object.keys(pd).length) ops.push({room:rid, perm:pd});

function modal({title, desc = "", body, size = "sm", ok = "확인", okClass = "pri", cancel = "취소", onOk, focus}){

  const x = m.querySelector("[data-x]"); if (x) x.onclick = close;

    box.querySelectorAll("input").forEach(i => i.value = "");
    $("pwBanner").hidden = true;
    info("✅ 비밀번호 변경 요청", `봇이 ${P.poll||20}초 안에 바꿉니다.<br>다음부터는 새 비밀번호로 들어오세요.`);
  } catch(e){ toast("⛔ " + e.message); }
}
function askMaster(name){
  modal({title:"🔒 마스터에게 문의", desc:`'${esc(name)}' 빈도는 AI 호출 비용이 늘어나서 방장 페이지에서 바로 바꿀 수 없어요.`,
    body:`<div style="font-size:13px;line-height:1.7">키위봇 마스터(두리)에게 설정을 문의해 주세요.</div>`, cancel:"", ok:"확인"});
}

// ── 이벤트 ──
document.addEventListener("click", e => {
  const t = e.target;
  const b = t.closest("[data-cat],[data-room],[data-open],[data-sw],[data-lock],[data-perm],[data-mv],[data-act],[data-pwgo],[data-ttab],[data-qjtab],[data-qjsel],[data-qjnew],[data-qjsave],[data-qjtrash],[data-qjdel],[data-qjbulk],.sw");
  if (!b || b.disabled) return;
  const s = state[sel];
  if (b.dataset.cat) {
    if (cat === "all" && b.closest("#rail") && $("sec-" + b.dataset.cat)) { $("sec-" + b.dataset.cat).scrollIntoView({behavior:"smooth", block:"start"}); return; }
    cat = b.dataset.cat; document.querySelectorAll("#rail button.spy").forEach(x => x.classList.remove("spy")); renderRail(); renderMain(); window.scrollTo({top:0, behavior:"smooth"}); return;
  }
  if (b.dataset.room) { sel = b.dataset.room; cat = isMobile() ? "all" : P.schema[0].id; render(); window.scrollTo({top:0}); return; }
  if (b.dataset.open) { openCfg(b.dataset.open); return; }
  if (b.dataset.sw) { const k = b.dataset.sw, i = k.indexOf("."), c = catOf(k.slice(0, i)), r = c.rows.find(x => x.id === k.slice(i + 1));
    const on = !rowOn(c, r); s.v[k] = r.onval ? r.onval[on ? 0 : 1] : on; renderMain(true); renderHeader(); updateBar(); return; }
  if (b.dataset.lock) { s.locks.has(b.dataset.lock) ? s.locks.delete(b.dataset.lock) : s.locks.add(b.dataset.lock); renderMain(true); updateBar(); return; }
  if (b.dataset.perm) { s.perm[b.dataset.perm] = s.perm[b.dataset.perm] === false; b.setAttribute("aria-checked", s.perm[b.dataset.perm] !== false); updateBar(); return; }
  if (b.dataset.mv) { const st = b.closest(".step"), wrap = st.parentElement, sib = b.dataset.mv === "up" ? st.previousElementSibling : st.nextElementSibling; if (!sib) return;
    b.dataset.mv === "up" ? wrap.insertBefore(st, sib) : wrap.insertBefore(sib, st);
    [...wrap.children].forEach((el, i) => { el.querySelector(".ord").textContent = i + 1; el.querySelector("[data-mv=up]").disabled = i === 0; el.querySelector("[data-mv=down]").disabled = i === wrap.children.length - 1; }); return; }
  if (b.dataset.act) { doAct(b.dataset.act); return; }
  if (b.dataset.pwgo) { doPw(b.dataset.pwgo, b.closest("[data-pw]")); return; }
  if (b.dataset.ttab !== undefined) { const box = b.closest("[data-tt]"), t2 = view(box.dataset.tt).tabs[+b.dataset.ttab];
    box.querySelectorAll("[data-ttab]").forEach(x => x.classList.toggle("on", x === b)); box.dataset.cur = b.dataset.ttab; box.querySelector("[data-ttbody]").innerHTML = ttBodyHtml(filterTab(t2, box.querySelector("[data-ttq]").value)); return; }
  if (b.dataset.qjtab) { qjState.tab = b.dataset.qjtab; qjRefresh(); return; }
  if (b.dataset.qjsel !== undefined) { if (t.matches("[data-qjchk]")) { t.checked ? qjState.checked.add(t.dataset.qjchk) : qjState.checked.delete(t.dataset.qjchk); qjRefresh(); return; } qjState.sel = b.dataset.qjsel; qjRefresh(); return; }
  if (b.dataset.qjnew !== undefined) { qjState.sel = "__new__"; qjRefresh(); return; }
  if (b.dataset.qjsave !== undefined) { const text = $("qjText").value.trim(); if (!text) return toast("내용을 입력하세요");
    const nick = qjState.sel === "__new__" ? "" : qjState.sel;
    qjSend([{op:"save", nick, content:text}], "저장 요청").then(ok => { if (ok && nick) { const it = qjData().list.find(x => x.nick === nick); if (it) it.body = text; } }); return; }
  if (b.dataset.qjtrash !== undefined) { const nick = qjState.sel;
    modal({title:"휴지통으로", body:`<div style="font-size:13px">${esc(nick)} 공질을 휴지통으로 옮깁니다 (30일 보관).</div>`, ok:"옮기기", okClass:"dan",
      onOk: () => qjSend([{op:"del", nick}], "삭제 요청").then(ok => { if (ok) { qjData().list = qjData().list.filter(x => x.nick !== nick); qjState.sel = null; qjRefresh(); } return ok; })}); return; }
  if (b.dataset.qjdel !== undefined) { const L = [...qjState.checked]; if (!L.length) return toast("목록에서 체크하세요");
    modal({title:"선택 삭제", body:`<div style="font-size:13px">${L.length}명의 공질을 휴지통으로 옮깁니다 (30일 보관).<br><span style="color:var(--muted)">${esc(L.join(", "))}</span></div>`, ok:"옮기기", okClass:"dan",
      onOk: () => qjSend(L.map(nick => ({op:"del", nick})), `${L.length}건 삭제 요청`).then(ok => { if (ok) { qjData().list = qjData().list.filter(x => !qjState.checked.has(x.nick)); qjState.checked.clear(); qjState.sel = null; qjRefresh(); } return ok; })}); return; }
  if (b.dataset.qjbulk !== undefined) { const text = $("qjBulk").value.trim(); if (!text) return toast("내용을 붙여 넣으세요"); qjSend([{op:"bulk", content:text}], "일괄등록 요청").then(ok => { if (ok) $("qjBulk").value = ""; }); return; }
  if (b.classList.contains("sw")) {   // 팝업 안의 토글 (field · step · gamelimit slot)
    b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true");
    const st = b.closest(".step"); if (st && b.dataset.stepsw) st.classList.toggle("off", b.getAttribute("aria-checked") !== "true");
  }
});
function filterTab(t, q){ q = (q||"").trim(); return q ? {...t, tr:t.tr.filter(r => r.join(" ").includes(q))} : t; }
document.addEventListener("input", e => {
  const el = e.target;
  if (el.type === "range" && el.dataset.f) { const v = el.previousElementSibling; if (v) v.textContent = el.value + (el.dataset.unit || ""); }
  if (el.dataset.ttq !== undefined) { const box = el.closest("[data-tt]"); box.querySelector("[data-ttbody]").innerHTML = ttBodyHtml(filterTab(view(box.dataset.tt).tabs[+(box.dataset.cur||0)], el.value)); }
  if (el.id === "qjQ") { qjState.q = el.value; const pos = el.selectionStart; qjRefresh(); const n = $("qjQ"); n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "qjSort") { qjState.sort = el.value; qjRefresh(); return; }
  if (el.matches("[data-glmode]")) { el.closest("[data-fk]").querySelectorAll(".glopt").forEach(o => o.hidden = +o.dataset.glfor !== el.selectedIndex); return; }
  if (el.matches("select[data-f]") && cur) {   // 프리셋: 방장 상한 + 자동 반영
    const f = fieldDef(el.dataset.f); if (!f) return;
    const idx = +el.value;
    if (f.limitHost != null && !isM() && idx > f.limitHost) { el.value = el.dataset.prev ?? 0; askMaster(f.o[idx][1]); return; }
    el.dataset.prev = idx;
    const fw = $("cfgBody").querySelector(`[data-follow="${CSS.escape(el.dataset.f)}"]`);   // 미리보기 따라 바꾸기
    if (fw) { const m = view(fw.dataset.map) || {}, v0 = f.o[idx][0]; fw.textContent = m[v0] ?? "(양식 파일 없음)";
      const lb = $("cfgBody").querySelector(`[data-followlbl="${CSS.escape(el.dataset.f)}"]`); if (lb) lb.textContent = followLbl(cur.c, f, v0); }
    const p = f.preset && f.preset[f.o[idx][0]];
    if (p) Object.entries(p).forEach(([k, v]) => {
      const box = $("cfgBody").querySelector(`[data-fk="${CSS.escape(cur.c.id + "." + k)}"]`); const inp = box && box.querySelector("input"); if (!inp) return;
      inp.value = v; if (inp.type === "range") inp.previousElementSibling.textContent = v + (inp.dataset.unit || "");
      cur.draft[cur.c.id + "." + k] = inp.type === "range" ? Number(v) : v;   // 잠긴(음영) 필드도 프리셋 값은 따라간다
    });
  }
});
$("msel").addEventListener("change", e => { cat = e.target.value; renderRail(); renderMain(); window.scrollTo({top:0}); });
$("roomSel").addEventListener("change", e => { sel = e.target.value; render(); });
// 토스트 — 가운데 크게 5초 (아무 데나 누르면 바로 닫힘) · 새로고침 안내는 10초
function toast(m, o = {}){
  const t = $("toast"), msg = String(m || "");
  const kind = o.kind || (/^⛔|실패|오류/.test(msg) ? "err" : /^✅|저장됨|되돌렸습니다/.test(msg) ? "ok" : "");
  const ms = o.ms || 5000;
  const ico = o.ico || ({ok:"✅", err:"⛔"})[kind] || "";
  const text = msg.replace(/^(✅|⛔)\s*/, "");
  const [head, ...rest] = text.split(" — ");
  t.className = "toast" + (kind ? " " + kind : "");
  t.innerHTML = (ico ? `<div class="ti">${ico}</div>` : "") + `<div>${esc(head)}</div>` + (rest.length ? `<small>${esc(rest.join(" — "))}</small>` : "")
    + (o.html || "") + `<div class="tbar"><i style="animation-duration:${ms}ms"></i></div>`;
  void t.offsetWidth; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(hideToast, ms);
  t._at = Date.now();
}
function hideToast(){ const t = $("toast"); clearTimeout(t._h); t.classList.remove("show"); }
document.addEventListener("pointerdown", e => {          // 아무 데나 누르면 닫힘 (토스트 안 버튼은 그 버튼 동작)
  const t = $("toast"); if (!t.classList.contains("show") || Date.now() - (t._at || 0) < 250) return;
  if (e.target.closest("#toast button")) return;
  hideToast();
}, true);
// 열어 둔 지 오래됐거나 새 화면이 나오면 새로고침 안내 (10초)
let LATEST_SIG = "", refreshShownFor = "", staleNextAt = OPENED_AT + STALE_MIN * 60000;
function askRefresh(why){
  const pending = typeof state === "object" && Object.keys(state).some(id => changes(id) > 0);
  toast(why + " — " + (pending ? "저장하지 않은 변경이 있으면 먼저 저장한 뒤 새로고침하세요" : "새로고침하면 최신 화면 · 최신 자료로 볼 수 있어요"),
        {kind:"refresh", ico:"🔄", ms:10000, html:`<div class="tb"><button type="button" data-reload>새로고침</button><button type="button" class="g" data-later>나중에</button></div>`});
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-reload]")) { location.reload(); return; }
  if (e.target.closest("[data-later]")) { hideToast(); }
});
function checkStale(){
  if (!P || document.hidden) return;
  const sg = LATEST_SIG || P.sig;
  if (sg && !PAGE_SIG.startsWith("__") && sg !== PAGE_SIG && refreshShownFor !== sg) { refreshShownFor = sg; askRefresh("새 화면이 나왔어요"); return; }
  if (Date.now() >= staleNextAt) { staleNextAt = Date.now() + STALE_MIN * 60000; askRefresh("페이지를 연 지 오래됐어요"); }
}
setInterval(checkStale, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(checkStale, 1500); });
$("reset").onclick = () => { Object.values(state).forEach(s => { s.v = JSON.parse(J(s.orig)); s.perm = {...s.permOrig}; s.locks = new Set(s.locksOrig); }); render(true); toast("되돌렸습니다"); };
$("save").onclick = async () => {
  const ops = buildOps(); if (!ops.length) return;
  $("save").disabled = true; $("save").textContent = "저장 중…";
  try {
    await queueOps(ops);
    Object.values(state).forEach(s => { s.orig = JSON.parse(J(s.v)); s.permOrig = {...s.perm}; s.locksOrig = new Set(s.locks); });
    render(true); toast(`저장됨 · ${ops.length}건 — 봇이 ${P.poll||20}초 안에 반영하고 방에 알립니다`);
  } catch(e) { toast("⛔ " + e.message); updateBar(); }
  $("save").textContent = "저장";
};
$("pwLater").onclick = () => { $("pwBanner").hidden = true; store.set("kiwi.botcfg.pwlater." + KEY.kid, String(Date.now())); };
const openPw = () => openCfg(isM() ? "rooms.pwmaster" : "rooms.pwroom");
$("pwGo").onclick = openPw; $("pwBtn").onclick = openPw;
window.addEventListener("beforeunload", e => { if (P && totalChanges()) { e.preventDefault(); e.returnValue = ""; } });
boot();
})();
</script>
